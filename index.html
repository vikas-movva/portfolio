<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vikas Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Set the active colour theme AND mode before first paint to avoid a flash.
         Change the value below (or src/theme/theme.ts → activeTheme) to retheme.
         Valid themes: cyan | violet | emerald | amber | rose
         Valid modes:  dark | light -->
    <script>
      document.documentElement.dataset.theme = 'rose'
      document.documentElement.dataset.themeMode = 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
