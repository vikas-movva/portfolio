<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/" />
    <script type="text/javascript">
      // SPA fallback: redirect all unknown paths to the app root.
      // GitHub Pages serves this 404.html for any unknown route; the app's
      // client-side router then handles the actual path.
      window.location.href = '/portfolio/' + window.location.pathname.replace('/portfolio/', '');
    </script>
    <title>Redirecting...</title>
  </head>
  <body>
    Redirecting...
  </body>
</html>
